<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AlgoWolf - Full Stack Developer Portfolio" />
    
    <!-- DNS Prefetch ve Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Critical CSS - İlk görünüm için gerekli stiller -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background-color: #000;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #root {
        min-height: 100vh;
      }
      /* Loading spinner için critical CSS */
      .loading-spinner {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 2rem;
        height: 2rem;
        border: 2px solid #333;
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: translate(-50%, -50%) rotate(360deg); }
      }
    </style>
    
    <title>AlgoWolf</title>
    
    <!-- Resource hints -->
    <link rel="preload" as="script" href="/src/main.tsx">
    <link rel="modulepreload" href="/src/App.tsx">
  </head>
  <body>
    <div id="root">
      <!-- Initial loading state -->
      <div class="loading-spinner"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Noscript fallback -->
    <noscript>
      <style>
        .loading-spinner { display: none; }
      </style>
      <div style="text-align: center; padding: 2rem;">
        Bu siteyi görüntülemek için JavaScript'i etkinleştirmeniz gerekiyor.
      </div>
    </noscript>
  </body>
</html>
